name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relayforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (sqlite)
        if: matrix.db == 'sqlite'
        run: pytest
      - name: pytest (postgres)
        if: matrix.db == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5432/relayforge_test
        run: pytest
