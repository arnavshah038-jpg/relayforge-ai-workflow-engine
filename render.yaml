databases:
  - name: relayforge-db
    plan: free
    databaseName: relayforge
    user: relayforge

services:
  - type: web
    name: relayforge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: "alembic upgrade head && python -m app.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: relayforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: SIGNUP_ENABLED
        value: "false"
